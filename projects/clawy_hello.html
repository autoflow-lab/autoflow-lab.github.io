<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, sans-serif;
    overflow: hidden;
  }
  .crab {
    font-size: 200px;
    animation: bounce 1s infinite alternate;
    filter: drop-shadow(0 0 40px rgba(251,146,60,0.8));
  }
  @keyframes bounce {
    from { transform: translateY(0px) rotate(-5deg); }
    to   { transform: translateY(-30px) rotate(5deg); }
  }
  h1 {
    color: white;
    font-size: 80px;
    font-weight: 900;
    margin-top: 40px;
    text-align: center;
    letter-spacing: -2px;
  }
  h1 span { color: #fb923c; }
  p {
    color: #94a3b8;
    font-size: 36px;
    margin-top: 20px;
    text-align: center;
  }
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: -1;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
  }
</style>
</head>
<body>
  <div class="crab">🦀</div>
  <h1>Hallo <span>Janis</span>!</h1>
  <p>Deine Krabbe sagt Grüezi 👋</p>

  <script>
    // Add twinkling stars
    for (let i = 0; i < 60; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 4 + 1;
      star.style.cssText = `
        width: ${size}px; height: ${size}px;
        top: ${Math.random()*100}%;
        left: ${Math.random()*100}%;
        opacity: ${Math.random()};
        animation-delay: ${Math.random()*2}s;
        animation-duration: ${1+Math.random()*2}s;
      `;
      document.querySelector('.stars')?.appendChild(star) || document.body.appendChild(star);
    }
  </script>
</body>
</html>
