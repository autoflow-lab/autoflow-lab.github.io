<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, sans-serif;
  }
  img {
    max-height: 82vh;
    max-width: 95vw;
    border-radius: 40px;
    box-shadow: 0 0 100px rgba(255,255,255,0.3);
    object-fit: cover;
  }
  h1 {
    color: white;
    font-size: 52px;
    font-weight: 900;
    margin-top: 24px;
  }
  h1 span { color: #fb923c; }
</style>
</head>
<body>
  <img src="https://images.dog.ceo/breeds/samoyed/n02111889_15299.jpg" alt="Cute Samoyed">
  <h1>🤍 Von deiner <span>Krabbe</span> 🦀</h1>
</body>
</html>
