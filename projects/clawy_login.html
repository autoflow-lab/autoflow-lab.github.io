<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Clawy · Zuhause</title>
<style>
/* ─── RESET & BASE ─────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --a:#e040fb;--ag:rgba(224,64,251,0.25);--ab:rgba(224,64,251,0.18);
  --bg:#04050d;--card:rgba(7,9,18,0.92);
}
html,body{
  width:100%;min-height:100%;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  color:#c8d4e0;overflow-x:hidden;
}

/* ─── AMBIENT BACKGROUND ───────────────────────── */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(0);}
.orb1{width:700px;height:700px;top:-200px;left:-150px;
  background:radial-gradient(circle,rgba(224,64,251,0.22) 0%,transparent 65%);
  animation:orb1 20s ease-in-out infinite alternate;}
.orb2{width:500px;height:500px;bottom:-100px;right:-100px;
  background:radial-gradient(circle,rgba(0,229,255,0.1) 0%,transparent 65%);
  animation:orb2 26s ease-in-out infinite alternate;}
.orb3{width:350px;height:350px;top:40%;left:50%;
  background:radial-gradient(circle,rgba(118,255,3,0.06) 0%,transparent 65%);
  animation:orb3 34s ease-in-out infinite alternate;}
@keyframes orb1{from{transform:translate(0,0)}to{transform:translate(60px,40px)}}
@keyframes orb2{from{transform:translate(0,0)}to{transform:translate(-40px,-30px)}}
@keyframes orb3{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.4)}}

/* stars */
.stars{position:absolute;inset:0;}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite alternate;}
@keyframes twinkle{from{opacity:0.1}to{opacity:0.6}}

/* ─── LAYOUT ───────────────────────────────────── */
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}

/* ─── HERO HEADER ──────────────────────────────── */
.hero{text-align:center;margin-bottom:48px;}
.crab-wrap{margin-bottom:16px;perspective:400px;}
.crab-3d{
  display:inline-block;font-size:80px;
  transform-style:preserve-3d;
  animation:crab3d 5s ease-in-out infinite;
  filter:drop-shadow(0 0 20px rgba(224,64,251,0.7)) drop-shadow(0 0 60px rgba(224,64,251,0.3));
  cursor:default;user-select:none;
}
@keyframes crab3d{
  0%{transform:rotateY(-18deg) rotateX(8deg) translateY(0);}
  30%{transform:rotateY(18deg) rotateX(-6deg) translateY(-12px);}
  60%{transform:rotateY(-12deg) rotateX(10deg) translateY(-6px);}
  80%{transform:rotateY(20deg) rotateX(-8deg) translateY(-14px);}
  100%{transform:rotateY(-18deg) rotateX(8deg) translateY(0);}
}
.crab-shadow{width:70px;height:14px;margin:-4px auto 0;border-radius:50%;background:rgba(224,64,251,0.3);filter:blur(8px);animation:cshadow 5s ease-in-out infinite;}
@keyframes cshadow{0%,100%{width:65px;opacity:0.5}30%,80%{width:85px;opacity:0.2}60%{width:70px;opacity:0.35}}

.brand{font-size:42px;font-weight:200;color:#fff;letter-spacing:6px;text-transform:uppercase;margin-bottom:8px;}
.brand span{color:var(--a);}
.tagline{font-size:14px;color:rgba(255,255,255,0.35);letter-spacing:3px;text-transform:uppercase;}

/* ─── STATUS ROW ───────────────────────────────── */
.status-row{display:flex;gap:24px;margin-bottom:40px;flex-wrap:wrap;justify-content:center;}
.status-chip{
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;padding:6px 16px;font-size:12px;color:rgba(255,255,255,0.45);letter-spacing:1px;
  display:flex;align-items:center;gap:6px;
}
.dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(74,222,128,0.4)}50%{opacity:0.7;box-shadow:0 0 0 5px rgba(74,222,128,0)}}

/* ─── LOGIN CARD ───────────────────────────────── */
.login-card{
  background:var(--card);
  border:1px solid var(--ab);
  border-radius:24px;padding:48px 52px;width:100%;max-width:440px;
  backdrop-filter:blur(30px);
  box-shadow:0 0 80px rgba(224,64,251,0.12),0 0 0 1px rgba(255,255,255,0.02),0 20px 60px rgba(0,0,0,0.7);
  animation:cardIn 0.6s cubic-bezier(0.34,1.3,0.64,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}

.card-title{font-size:13px;color:rgba(255,255,255,0.35);letter-spacing:2px;text-transform:uppercase;margin-bottom:28px;text-align:center;}
.card-icon{font-size:20px;vertical-align:-3px;margin-right:6px;}

/* field groups */
.field-group{margin-bottom:18px;}
.field-label{font-size:11px;color:rgba(255,255,255,0.35);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;display:block;}
.field-wrap{position:relative;}
.field-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;opacity:0.4;}
input[type=text],input[type=password]{
  width:100%;padding:14px 16px 14px 44px;
  background:rgba(255,255,255,0.04);
  border:1.5px solid rgba(224,64,251,0.2);
  border-radius:14px;color:#fff;font-size:15px;
  outline:none;transition:border-color 0.25s,box-shadow 0.25s;
  font-family:inherit;
}
input:focus{border-color:var(--a);box-shadow:0 0 25px rgba(224,64,251,0.25);}
input::placeholder{color:rgba(255,255,255,0.2);font-size:14px;}

/* 2FA */
.totp-wrap{display:flex;gap:8px;justify-content:center;margin-top:4px;}
.totp-digit{
  width:48px;height:56px;text-align:center;
  background:rgba(255,255,255,0.04);border:1.5px solid rgba(224,64,251,0.2);
  border-radius:12px;color:#fff;font-size:22px;letter-spacing:0;
  outline:none;transition:border-color 0.2s,box-shadow 0.2s;
}
.totp-digit:focus{border-color:var(--a);box-shadow:0 0 20px rgba(224,64,251,0.3);}

/* login btn */
.login-btn{
  display:block;width:100%;padding:16px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#e040fb 0%,#9c00d4 100%);
  color:#fff;font-size:16px;font-weight:600;letter-spacing:0.5px;
  cursor:pointer;margin-top:8px;
  box-shadow:0 0 30px rgba(224,64,251,0.5),0 4px 15px rgba(0,0,0,0.4);
  transition:transform 0.15s,box-shadow 0.2s;
  font-family:inherit;
}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(224,64,251,0.65),0 6px 20px rgba(0,0,0,0.4);}
.login-btn:active{transform:scale(0.97);}

/* divider */
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:rgba(255,255,255,0.2);font-size:11px;letter-spacing:1px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.07);}

/* ─── BOTTOM INFO ──────────────────────────────── */
.bottom{margin-top:32px;text-align:center;}
.bottom-link{color:rgba(255,255,255,0.2);font-size:11px;letter-spacing:1px;text-decoration:none;transition:color 0.2s;}
.bottom-link:hover{color:var(--a);}
.version-badge{display:inline-block;background:rgba(224,64,251,0.1);border:1px solid rgba(224,64,251,0.2);border-radius:20px;padding:4px 12px;font-size:10px;color:rgba(224,64,251,0.6);letter-spacing:1px;margin-top:10px;}

/* ─── PARTICLES ────────────────────────────────── */
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;}
.particle{position:absolute;width:3px;height:3px;background:var(--a);border-radius:50%;animation:drift var(--dur,8s) linear infinite;opacity:0;}
@keyframes drift{
  0%{opacity:0;transform:translateY(100vh) translateX(0);}
  10%{opacity:0.4;}
  90%{opacity:0.2;}
  100%{opacity:0;transform:translateY(-20px) translateX(var(--tx,30px));}
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="stars" id="stars"></div>
</div>
<div class="particles" id="particles"></div>

<div class="page">

  <!-- HERO -->
  <div class="hero">
    <div class="crab-wrap">
      <div class="crab-3d" id="hero-crab">🦀</div>
      <div class="crab-shadow"></div>
    </div>
    <div class="brand">Clawy<span>.</span></div>
    <div class="tagline">Dein Zuhause · Intelligent</div>
  </div>

  <!-- STATUS -->
  <div class="status-row">
    <div class="status-chip"><div class="dot"></div> System online</div>
    <div class="status-chip">🌡️ Egg SZ</div>
    <div class="status-chip" id="time-chip">⏰ --:--</div>
  </div>

  <!-- LOGIN CARD -->
  <div class="login-card">
    <div class="card-title"><span class="card-icon">🔐</span>Sicherer Zugang</div>

    <div class="field-group">
      <label class="field-label">Benutzername</label>
      <div class="field-wrap">
        <span class="field-icon">👤</span>
        <input type="text" id="user" placeholder="Dein Benutzername" autocomplete="username" autofocus>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">Passwort</label>
      <div class="field-wrap">
        <span class="field-icon">🔑</span>
        <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
      </div>
    </div>

    <div class="divider">2-FAKTOR CODE</div>

    <div class="field-group">
      <label class="field-label" style="text-align:center">Code aus der Authenticator App</label>
      <div class="totp-wrap" id="totp-wrap">
        <input class="totp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
        <input class="totp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
        <input class="totp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
        <input class="totp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
        <input class="totp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
        <input class="totp-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
      </div>
    </div>

    <button class="login-btn" id="login-btn" onclick="submitLogin()">🚀 Einloggen</button>
  </div>

  <div class="bottom">
    <a class="bottom-link" href="/local/ambient.html">📺 Ambient Dashboard</a>
    <br>
    <span class="version-badge">Clawy Smart Home · HA 2025</span>
  </div>

</div>

<script>
// Stars
var starsEl=document.getElementById('stars');
for(var i=0;i<80;i++){
  var s=document.createElement('div');
  s.className='star';
  s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;--d:'+(2+Math.random()*5)+'s;opacity:'+(0.1+Math.random()*0.5)+';animation-delay:'+(Math.random()*4)+'s;'+(Math.random()>0.85?'width:3px;height:3px;':'');
  starsEl.appendChild(s);
}

// Particles
var pEl=document.getElementById('particles');
for(var j=0;j<15;j++){
  var p=document.createElement('div');
  p.className='particle';
  p.style.cssText='left:'+Math.random()*100+'%;--dur:'+(6+Math.random()*12)+'s;--tx:'+(Math.random()-0.5)*80+'px;animation-delay:'+(Math.random()*10)+'s;';
  pEl.appendChild(p);
}

// Time
function updateTime(){
  var now=new Date();
  var h=String(now.getHours()).padStart(2,'0');
  var m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('time-chip').textContent='⏰ '+h+':'+m;
}
updateTime();setInterval(updateTime,10000);

// TOTP auto-advance
var totpInputs=document.querySelectorAll('.totp-digit');
totpInputs.forEach(function(inp,i){
  inp.addEventListener('input',function(){
    // Handle paste of full 6-digit code
    if(inp.value.length>1){
      var full=inp.value.replace(/\D/g,'').slice(0,6);
      for(var k=0;k<totpInputs.length&&k<full.length;k++)totpInputs[k].value=full[k];
      totpInputs[Math.min(full.length,5)].focus();
      inp.value=inp.value.slice(-1);
      return;
    }
    if(inp.value&&i<5)totpInputs[i+1].focus();
  });
  inp.addEventListener('keydown',function(e){
    if(e.key==='Backspace'&&!inp.value&&i>0){totpInputs[i-1].focus();totpInputs[i-1].value='';}
    if(e.key==='Enter')submitLogin();
  });
});

document.getElementById('pass').addEventListener('keydown',function(e){
  if(e.key==='Enter')totpInputs[0].focus();
});

// Login → redirects to real HA with credentials
// (This is a visual wrapper — actual HA login handles auth)
function submitLogin(){
  var btn=document.getElementById('login-btn');
  btn.textContent='🦀 Verbinde...';
  btn.style.background='linear-gradient(135deg,#4ade80,#22c55e)';
  setTimeout(function(){
    window.location.href='/';
  },600);
}

// Easter egg: crab 3x click
var heroClicks=0;
document.getElementById('hero-crab').addEventListener('click',function(){
  heroClicks++;
  if(heroClicks===3){
    this.textContent='🎉';
    var me=this;
    setTimeout(function(){me.textContent='🦀';},1500);
  }
  if(heroClicks===7){
    this.style.animation='none';
    this.style.transform='rotate(720deg) scale(1.5)';
    this.style.transition='transform 0.5s';
    var me2=this;
    setTimeout(function(){me2.style.transform='';me2.style.transition='';me2.style.animation='';heroClicks=0;},700);
  }
});
</script>
</body>
</html>
