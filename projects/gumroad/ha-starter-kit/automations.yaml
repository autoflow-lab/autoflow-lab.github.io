# 🏠 Home Assistant Starter Automations
# Copy these into your automations.yaml or import via UI

# ──────────────────────────────────────────
# 1. SMART WAKE-UP ROUTINE
# ──────────────────────────────────────────
- id: smart_wakeup
  alias: "Smart Wake-Up Routine"
  description: "Gradual lights + music when alarm goes off"
  trigger:
    - platform: time
      at: input_datetime.wakeup_time
  condition:
    - condition: state
      entity_id: input_boolean.wakeup_enabled
      state: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        kelvin: 2700
        brightness: 80
        transition: 30
    - delay:
        minutes: 5
    - service: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        brightness: 220
        transition: 120
    - service: media_player.media_play
      target:
        entity_id: media_player.bedroom_speaker
  mode: single

# ──────────────────────────────────────────
# 2. GOODNIGHT ROUTINE
# ──────────────────────────────────────────
- id: goodnight_routine
  alias: "Goodnight Routine"
  description: "Turn off all lights when going to bed"
  trigger:
    - platform: time
      at: "23:00:00"
  action:
    - service: light.turn_off
      target:
        entity_id: all
    - service: switch.turn_off
      target:
        entity_id: all
    - service: media_player.media_pause
      target:
        entity_id: all
  mode: single

# ──────────────────────────────────────────
# 3. PRESENCE LIGHTING
# ──────────────────────────────────────────
- id: presence_lights_on
  alias: "Lights On When Home"
  trigger:
    - platform: state
      entity_id: person.your_name
      from: "not_home"
      to: "home"
  condition:
    - condition: sun
      after: sunset
  action:
    - service: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness: 180
        kelvin: 3000
  mode: single

- id: presence_lights_off
  alias: "Lights Off When Away"
  trigger:
    - platform: state
      entity_id: person.your_name
      from: "home"
      to: "not_home"
      for:
        minutes: 5
  action:
    - service: light.turn_off
      target:
        entity_id: all
    - service: media_player.media_pause
      target:
        entity_id: all
  mode: single

# ──────────────────────────────────────────
# 4. GUEST MODE
# ──────────────────────────────────────────
- id: guest_mode_on
  alias: "Guest Mode: Activate"
  trigger:
    - platform: state
      entity_id: input_boolean.guest_mode
      to: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness: 200
        kelvin: 3500
    - service: media_player.volume_set
      target:
        entity_id: media_player.living_room
      data:
        volume_level: 0.3
  mode: single
