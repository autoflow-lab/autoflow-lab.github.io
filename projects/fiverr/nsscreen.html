<!DOCTYPE html>
<!-- Sonoff NS Panel Pro · 480×480 · autoflow-lab -->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache">
<title>NS Panel</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--c1:#1c1c1e;--c2:#2c2c2e;--c3:#3a3a3c;--acc:#ff9f0a;--blue:#0a84ff;--grn:#30d158;--txt:#fff}
html,body{width:480px;height:480px;background:var(--bg);color:var(--txt);font-family:-apple-system,sans-serif;overflow:hidden}
/* Layout */
.grid{display:grid;grid-template-rows:100px 1fr 80px;height:480px;width:480px}
/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:linear-gradient(180deg,#0a0a0a,var(--bg))}
.clock{font-size:2.8rem;font-weight:100;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.clk-sub{font-size:.7rem;color:rgba(255,255,255,.35);margin-top:2px;letter-spacing:.5px}
.wx-mini{display:flex;align-items:center;gap:8px}
.wx-temp{font-size:1.4rem;font-weight:200}
.wx-ico{font-size:1.6rem}
/* Main tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:8px;padding:8px 12px}
.tile{border-radius:14px;background:var(--c2);display:flex;flex-direction:column;padding:10px;cursor:pointer;
  border:1px solid rgba(255,255,255,.055);border-top-color:rgba(255,255,255,.13);
  position:relative;overflow:hidden;transition:background .3s,transform .12s}
.tile::before{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 45%);pointer-events:none}
.tile:active{transform:scale(.92)}
.tile.on{box-shadow:0 0 14px rgba(var(--tlc,255,159,10),.2)}
.tile-ico{font-size:1.2rem;margin-bottom:4px}
.tile-name{font-size:.58rem;font-weight:600;color:rgba(255,255,255,.6);line-height:1.2}
.tile-st{font-size:.52rem;color:rgba(255,255,255,.35);margin-top:2px}
/* Bottom nav */
.nav{display:flex;border-top:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.6)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:.52rem;color:rgba(255,255,255,.4);padding:8px 0;transition:color .2s}
.nav-btn.act{color:var(--acc)}
.nav-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* Toast */
#ns-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(44,44,46,.95);color:#fff;padding:7px 16px;border-radius:100px;font-size:.7rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999}
#ns-toast.show{opacity:1}
</style>
</head>
<body>
<div class="grid">
  <div class="hdr">
    <div>
      <div class="clock" id="ns-clock">--:--</div>
      <div class="clk-sub" id="ns-date">–</div>
    </div>
    <div class="wx-mini">
      <span class="wx-ico" id="ns-wx-ico">🌤</span>
      <span class="wx-temp" id="ns-wx-t">–°</span>
    </div>
  </div>
  <div class="tiles" id="ns-tiles"></div>
  <nav class="nav">
    <div class="nav-btn act" data-p="home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home
    </div>
    <div class="nav-btn" data-p="szenen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/></svg>Szenen
    </div>
    <div class="nav-btn" data-p="musik">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Musik
    </div>
    <div class="nav-btn" data-p="wetter">
      <svg viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>Wetter
    </div>
  </nav>
</div>
<div id="ns-toast"></div>
<script>
const HA='http://192.168.1.123:8123';
const LS_KEY='wz4';
let _S={},_tok=null;

const TILES=[
  {id:'light.h618a',     name:'Sofa LED',  ico:'💡',domain:'light'},
  {id:'light.h618a_2',   name:'Küche LED', ico:'💡',domain:'light'},
  {id:'light.hue_play_l',name:'Büro',      ico:'💡',domain:'light'},
  {id:'light.gang_og_licht',name:'Gang OG',ico:'💡',domain:'light'},
  {id:'light.gang_eg_licht',name:'Gang EG',ico:'💡',domain:'light'},
  {id:'switch.shelly1_98cdac0ca9b2',name:'Wand',ico:'🔆',domain:'switch'},
  {id:'media_player.wohnzimmer_alm',name:'Almando',ico:'🎵',domain:'media_player'},
  {id:'media_player.lg_webos_tv_oled65g49ls_2',name:'LG TV',ico:'📺',domain:'media_player'},
];

const WC={'0':'☀️','1':'🌤','2':'⛅','3':'☁️','45':'🌫','61':'🌦','63':'🌧','65':'🌧','80':'🌦','95':'⛈'};

function getTok(){
  try{const raw=localStorage.getItem(LS_KEY);if(!raw)return null;const p=JSON.parse(raw);return p?.access_token||p;}catch{return null;}
}

function st(id){return _S[id]?.state||'off';}

async function fetchStates(){
  const tok=getTok();if(!tok)return;
  try{
    const r=await fetch(HA+'/api/states',{headers:{'Authorization':'Bearer '+tok}});
    if(r.ok){const arr=await r.json();arr.forEach(s=>{_S[s.entity_id]=s;});updateTiles();}
  }catch(e){console.warn(e);}
}

function svc(domain,service,data){
  const tok=getTok();if(!tok)return;
  fetch(HA+`/api/services/${domain}/${service}`,{
    method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
    body:JSON.stringify(data)
  }).then(()=>setTimeout(fetchStates,500));
}

function buildTiles(){
  const c=document.getElementById('ns-tiles');
  c.innerHTML=TILES.map((t,i)=>`
    <div class="tile" data-i="${i}" id="nst-${i}">
      <div class="tile-ico">${t.ico}</div>
      <div class="tile-name">${t.name}</div>
      <div class="tile-st" id="nst-st-${i}">Aus</div>
    </div>`).join('');
  TILES.forEach((t,i)=>{
    document.getElementById('nst-'+i).addEventListener('click',()=>{
      const wasOn=st(t.id)==='on'||st(t.id)==='playing';
      if(t.domain==='light') svc('light','toggle',{entity_id:t.id});
      else if(t.domain==='switch') svc('switch',wasOn?'turn_off':'turn_on',{entity_id:t.id});
      // Optimistic
      const el=document.getElementById('nst-'+i);
      el.style.background=wasOn?'':' rgba(255,159,10,.3)';
      document.getElementById('nst-st-'+i).textContent=wasOn?'Aus':'An';
      showToast((wasOn?'Aus: ':'An: ')+t.name);
    });
  });
}

function updateTiles(){
  TILES.forEach((t,i)=>{
    const s=_S[t.id];if(!s)return;
    const on=s.state==='on'||s.state==='playing';
    const el=document.getElementById('nst-'+i);if(!el)return;
    const rgb=s.attributes?.rgb_color;
    let lc='255,159,10';
    if(rgb&&rgb.length===3)lc=rgb.join(',');
    el.classList.toggle('on',on);
    el.style.background=on?`linear-gradient(145deg,rgb(${lc.split(',').map(v=>Math.round(+v*.12)).join(',')}),rgb(${lc.split(',').map(v=>Math.round(+v*.2)).join(',')}))` :'';
    el.style.setProperty('--tlc',lc);
    const se=document.getElementById('nst-st-'+i);
    if(!se)return;
    if(t.domain==='media_player'){
      se.textContent=on?(s.attributes?.media_title||'Spielt'):'Aus';
    } else {
      const bri=Math.round((s.attributes?.brightness||0)/2.55);
      se.textContent=on?(bri>0?bri+'%':'An'):'Aus';
    }
  });
}

function updateClock(){
  const now=new Date();
  document.getElementById('ns-clock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const days=['So','Mo','Di','Mi','Do','Fr','Sa'];
  const months=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  document.getElementById('ns-date').textContent=days[now.getDay()]+' · '+now.getDate()+' '+months[now.getMonth()];
}

async function fetchWeather(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=47.170&longitude=8.783&current=temperature_2m,weather_code&timezone=Europe%2FZurich&models=best_match');
    const d=await r.json();
    const t=Math.round(d.current.temperature_2m);
    const ico=WC[String(d.current.weather_code)]||'🌡';
    document.getElementById('ns-wx-t').textContent=t+'°';
    document.getElementById('ns-wx-ico').textContent=ico;
  }catch(e){}
}

function showToast(msg){
  const t=document.getElementById('ns-toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// OAuth check - redirect to login if needed
function checkAuth(){
  const tok=getTok();
  if(!tok){
    window.location.href=HA+'/auth/authorize?response_type=code&client_id='+encodeURIComponent(location.origin+'/')+'&redirect_uri='+encodeURIComponent(location.href);
    return false;
  }
  return true;
}

// Handle OAuth callback
async function handleCallback(){
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  if(code){
    try{
      const r=await fetch(HA+'/auth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'grant_type=authorization_code&code='+code+'&client_id='+encodeURIComponent(location.origin+'/')+'&redirect_uri='+encodeURIComponent(location.origin+location.pathname)});
      if(r.ok){const tok=await r.json();localStorage.setItem(LS_KEY,JSON.stringify(tok));history.replaceState({},'',location.pathname);}
    }catch(e){console.error(e);}
  }
}

async function boot(){
  await handleCallback();
  if(!checkAuth())return;
  buildTiles();
  updateClock();
  setInterval(updateClock,30000);
  fetchStates();
  setInterval(fetchStates,5000);
  fetchWeather();
  setInterval(fetchWeather,600000);
}
boot();
</script>
</body>
</html>
