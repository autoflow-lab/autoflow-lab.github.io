<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Smart Home · NS Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{--bg:#000;--c1:#1c1c1e;--c2:#2c2c2e;--c3:#3a3a3c;--acc:#ff9f0a;--blue:#0a84ff;--grn:#30d158;--red:#ff453a;--txt:#fff;--dim:rgba(255,255,255,.45);--dim2:rgba(255,255,255,.22);--sep:rgba(255,255,255,.07)}
html,body{width:100%;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'SF Pro',Helvetica,sans-serif;overflow:hidden}

nav{position:fixed;bottom:0;left:0;right:0;height:54px;background:rgba(14,14,16,.96);backdrop-filter:blur(20px);border-top:1px solid var(--sep);display:flex;z-index:100}
.nb{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--dim);transition:color .2s;touch-action:manipulation}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb span{font-size:.44rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.nb.on{color:var(--acc)}

.pg{position:fixed;inset:0;bottom:54px;overflow-y:auto;padding:12px;display:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pg.on{display:block}

/* Clock */
.clock{text-align:center;padding:10px 0 14px}
.clock-t{font-size:3rem;font-weight:100;letter-spacing:-2px;line-height:1}
.clock-d{font-size:.6rem;color:var(--dim);margin-top:3px;letter-spacing:.3px}

/* Section label */
.lbl{font-size:.54rem;font-weight:700;letter-spacing:1.2px;color:var(--dim2);text-transform:uppercase;margin:12px 2px 8px;display:block}

/* Scenes grid */
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.sc{background:var(--c1);border-radius:16px;padding:14px 12px 12px;cursor:pointer;position:relative;overflow:hidden;border:1.5px solid transparent;transition:background .2s,border-color .2s,transform .15s;text-align:center;touch-action:manipulation}
.sc:active{transform:scale(.93)}
.sc.on{border-color:rgba(255,159,10,.4)}
.sc-ico{width:34px;height:34px;background:var(--c2);border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 9px;transition:background .2s}
.sc svg{width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:1.8;stroke-linecap:round;transition:stroke .2s}
.sc.on .sc-ico{background:rgba(255,159,10,.2)}
.sc.on .sc-ico svg{stroke:var(--acc)}
.sc-name{font-size:.7rem;font-weight:700;color:var(--dim)}
.sc.on .sc-name{color:#fff}

/* Light tiles */
.lt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lt{background:var(--c1);border-radius:16px;padding:13px 11px;cursor:pointer;border:1.5px solid transparent;transition:all .2s;touch-action:manipulation}
.lt:active{transform:scale(.94)}
.lt.on{background:rgba(255,159,10,.09);border-color:rgba(255,159,10,.28)}
.lt-ico{width:32px;height:32px;background:var(--c2);border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:9px;transition:background .2s}
.lt.on .lt-ico{background:rgba(255,159,10,.22)}
.lt-ico svg{width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:1.8;stroke-linecap:round;transition:stroke .2s}
.lt.on .lt-ico svg{stroke:var(--acc)}
.lt-name{font-size:.65rem;font-weight:600;color:var(--dim)}
.lt.on .lt-name{color:#fff}
.lt-st{font-size:.52rem;color:var(--dim2);margin-top:2px}
.lt.on .lt-st{color:rgba(255,159,10,.7)}
.lt-bar{height:3px;background:rgba(255,255,255,.07);border-radius:3px;margin-top:8px;overflow:hidden}
.lt-bar div{height:100%;background:var(--acc);border-radius:3px;transition:width .3s;width:0%}

/* Dimmer card */
.dim-card{background:var(--c1);border-radius:16px;padding:14px;margin-bottom:8px;border:1px solid var(--sep)}
.dim-head{display:flex;justify-content:space-between;margin-bottom:10px;align-items:center}
.dim-title{font-size:.68rem;font-weight:700;color:var(--dim)}
.dim-val{font-size:.68rem;font-weight:700;color:var(--acc)}
input[type=range].dslider{-webkit-appearance:none;width:100%;height:32px;border-radius:16px;cursor:pointer;outline:none;background:rgba(255,255,255,.1)}
input[type=range].dslider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c0c0c0);box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:grab}

/* Wetter */
.wx-card{background:linear-gradient(135deg,#0c1a2a,#152236);border-radius:16px;padding:14px;border:1px solid rgba(255,255,255,.06);margin-bottom:8px;position:relative;overflow:hidden}
.wx-main{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.wx-t{font-size:2rem;font-weight:100;letter-spacing:-1px}
.wx-desc{font-size:.62rem;color:var(--dim)}
.wx-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wx-stat{background:rgba(255,255,255,.05);border-radius:9px;padding:7px 4px;text-align:center}
.wx-sv{font-size:.7rem;font-weight:700}
.wx-sl{font-size:.46rem;color:var(--dim2);margin-top:2px}
.wx-hl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.wx-hi{flex-shrink:0;background:rgba(255,255,255,.05);border-radius:10px;padding:6px;text-align:center;min-width:44px}
.wx-hi-t{font-size:.46rem;color:var(--dim2)}
.wx-hi-v{font-size:.65rem;font-weight:700;margin-top:3px}
.wx-hi-p{font-size:.44rem;color:#60a5fa;margin-top:1px}

/* Login */
#login-ov{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.9);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:20px}
#login-ov h2{font-size:1rem;font-weight:700}
#login-ov p{font-size:.68rem;color:var(--dim);max-width:200px}
#login-btn{background:var(--blue);border:none;border-radius:12px;padding:12px 24px;color:#fff;font-size:.82rem;font-weight:700;cursor:pointer;touch-action:manipulation}

@keyframes sBreathe{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--grn);display:inline-block;animation:sBreathe 2s ease-in-out infinite;margin-right:4px}
@keyframes scenePulse{0%{opacity:.7}100%{opacity:1}}
</style>
</head>
<body>

<div id="login-ov">
  <h2>🔐 Bitte anmelden</h2>
  <p>Öffne wz.html auf dem iPad und melde dich dort an.</p>
  <button id="login-btn">Verbinden</button>
</div>

<!-- HOME PAGE -->
<div class="pg on" id="pg-home">
  <div class="clock">
    <div class="clock-t" id="ns-time">--:--</div>
    <div class="clock-d" id="ns-date">–</div>
  </div>

  <span class="lbl">Szenen</span>
  <div class="sc-grid" id="sc-grid"></div>

  <span class="lbl">Lichter</span>
  <div class="lt-grid" id="lt-grid"></div>
</div>

<!-- DIMMER PAGE -->
<div class="pg" id="pg-dim">
  <span class="lbl">Helligkeit</span>
  <div id="dim-cards"></div>
</div>

<!-- WETTER PAGE -->
<div class="pg" id="pg-wetter">
  <div class="wx-card" id="ns-wx-card">
    <div class="wx-main">
      <svg id="ns-wx-ico" viewBox="0 0 56 56" width="48" height="48"></svg>
      <div>
        <div class="wx-t" id="ns-wx-t">–°</div>
        <div class="wx-desc" id="ns-wx-d">Lade…</div>
      </div>
    </div>
    <div class="wx-stats">
      <div class="wx-stat"><div class="wx-sv" id="ns-hum">–</div><div class="wx-sl">Feuchte</div></div>
      <div class="wx-stat"><div class="wx-sv" id="ns-wind">–</div><div class="wx-sl">Wind</div></div>
      <div class="wx-stat"><div class="wx-sv" id="ns-vis">–</div><div class="wx-sl">Sicht</div></div>
    </div>
  </div>
  <div class="wx-hl" id="ns-hourly"></div>
</div>

<nav>
  <button class="nb on" data-pg="pg-home">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Home</span>
  </button>
  <button class="nb" data-pg="pg-dim">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
    <span>Dimmer</span>
  </button>
  <button class="nb" data-pg="pg-wetter">
    <svg viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
    <span>Wetter</span>
  </button>
</nav>

<script>
const HA='http://192.168.1.123:8123';
const CFG={
  lights:[
    {id:'light.h61e1',  name:'Wand',     dim:true,
     svg:'<path d="M9 21h6M12 3a6 6 0 0 1 6 6c0 2.5-1.3 4.7-3 6.1V17a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1v-1.9C7.3 13.7 6 11.5 6 9a6 6 0 0 1 6-6z"/>'},
    {id:'light.h618a',  name:'Sofa',     dim:true,
     svg:'<path d="M4 10h16M8 10V7a4 4 0 0 1 8 0v3"/><rect x="4" y="10" width="16" height="4" rx="2"/><path d="M4 14v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1"/>'},
    {id:'light.h618a_2',name:'Küche',    dim:true,
     svg:'<path d="M4 10h16M8 10V7a4 4 0 0 1 8 0v3"/><rect x="4" y="10" width="16" height="4" rx="2"/><path d="M4 14v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1"/>'},
    {id:'light.hue_play_l',name:'Büro Hue',dim:true,
     svg:'<path d="M9 21h6M12 3a6 6 0 0 1 6 6c0 2.5-1.3 4.7-3 6.1V17a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1v-1.9C7.3 13.7 6 11.5 6 9a6 6 0 0 1 6-6z"/>'},
    {id:'light.gang_eg_licht',name:'Gang EG',dim:false,
     svg:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>'},
    {id:'switch.shelly1_98cdac0ca9b2',name:'Wandlampe',dom:'switch',dim:false,
     svg:'<path d="M9 21h6M12 3a6 6 0 0 1 6 6c0 2.5-1.3 4.7-3 6.1V17a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1v-1.9C7.3 13.7 6 11.5 6 9a6 6 0 0 1 6-6z"/><line x1="12" y1="17" x2="12" y2="21"/>'},
  ],
  scenes:[
    {id:'morgen',name:'Morgen',ico:'🌅',col:'rgba(255,140,0,.1)',
     fn:()=>{
       ['light.h61e1','light.h618a','light.h618a_2'].forEach(id=>svc('light','turn_on',{entity_id:id,brightness_pct:65,color_temp_kelvin:3000,transition:3}));
       svc('switch','turn_on',{entity_id:'switch.shelly1_98cdac0ca9b2'});
     }},
    {id:'abend',name:'Abend',ico:'🌆',col:'rgba(255,100,0,.08)',
     fn:()=>{
       svc('light','turn_on',{entity_id:'light.h61e1',brightness_pct:70,rgb_color:[255,167,87]});
       svc('light','turn_on',{entity_id:'light.h618a',brightness_pct:55,rgb_color:[255,120,40]});
       svc('light','turn_on',{entity_id:'light.h618a_2',brightness_pct:45,rgb_color:[255,100,30]});
       svc('switch','turn_on',{entity_id:'switch.shelly1_98cdac0ca9b2'});
     }},
    {id:'hell',name:'Hell',ico:'☀️',col:'rgba(255,220,0,.08)',
     fn:()=>{
       ['light.h61e1','light.h618a','light.h618a_2'].forEach(id=>svc('light','turn_on',{entity_id:id,brightness_pct:100,color_temp_kelvin:4000,transition:1}));
       svc('switch','turn_on',{entity_id:'switch.shelly1_98cdac0ca9b2'});
     }},
    {id:'nacht',name:'Nacht',ico:'🌙',col:'rgba(80,60,150,.1)',
     fn:()=>{
       svc('light','turn_on',{entity_id:'light.h618a',brightness_pct:8,rgb_color:[255,100,20]});
       svc('light','turn_off',{entity_id:'light.h61e1'});
       svc('light','turn_off',{entity_id:'light.h618a_2'});
       svc('switch','turn_off',{entity_id:'switch.shelly1_98cdac0ca9b2'});
     }},
    {id:'film',name:'Film',ico:'🎬',col:'rgba(10,50,100,.12)',
     fn:()=>{
       ['light.h61e1','light.h618a','light.h618a_2'].forEach(id=>svc('light','turn_on',{entity_id:id,brightness_pct:30,rgb_color:[180,60,20]}));
       svc('switch','turn_off',{entity_id:'switch.shelly1_98cdac0ca9b2'});
     }},
    {id:'aus',name:'Alles Aus',ico:'⚫',col:'rgba(50,50,50,.08)',
     fn:()=>{
       ['light.h61e1','light.h618a','light.h618a_2','light.hue_play_l','light.gang_eg_licht'].forEach(id=>svc('light','turn_off',{entity_id:id}));
       svc('switch','turn_off',{entity_id:'switch.shelly1_98cdac0ca9b2'});
     }},
  ],
};

let _S={};

function getTok(){
  try{const d=JSON.parse(localStorage.getItem('wz4'));return d?.access_token||'';}catch{return '';}
}
function svc(domain,service,data){
  const tok=getTok();if(!tok)return;
  fetch(`${HA}/api/services/${domain}/${service}`,{
    method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
    body:JSON.stringify(data||{})
  }).then(()=>setTimeout(fetchAndUpdate,900)).catch(()=>{});
}
async function fetchAndUpdate(){
  const tok=getTok();
  if(!tok){document.getElementById('login-ov').style.display='flex';return;}
  document.getElementById('login-ov').style.display='none';
  try{
    const r=await fetch(`${HA}/api/states`,{headers:{'Authorization':'Bearer '+tok}});
    if(r.ok){const arr=await r.json();arr.forEach(s=>{_S[s.entity_id]=s;});updateUI();}
  }catch(e){}
}

function startClock(){
  const days=['So','Mo','Di','Mi','Do','Fr','Sa'];
  const months=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  function tick(){
    const n=new Date();
    document.getElementById('ns-time').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    document.getElementById('ns-date').textContent=days[n.getDay()]+', '+n.getDate()+'. '+months[n.getMonth()];
  }
  tick();setInterval(tick,15000);
}

function buildScenes(){
  const g=document.getElementById('sc-grid');
  g.innerHTML=CFG.scenes.map(s=>`
    <div class="sc" data-sc="${s.id}" style="background:${s.col}">
      <div class="sc-ico">
        <span style="font-size:1.2rem">${s.ico}</span>
      </div>
      <div class="sc-name">${s.name}</div>
    </div>`).join('');
  g.querySelectorAll('[data-sc]').forEach(b=>{
    b.addEventListener('click',()=>{
      const sc=CFG.scenes.find(x=>x.id===b.dataset.sc);
      if(!sc)return;
      sc.fn();
      g.querySelectorAll('.sc').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
    });
  });
}

function buildLights(){
  const g=document.getElementById('lt-grid');
  g.innerHTML=CFG.lights.map(l=>`
    <div class="lt" data-id="${l.id}" data-dom="${l.dom||'light'}">
      <div class="lt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${l.svg}</svg></div>
      <div class="lt-name">${l.name}</div>
      <div class="lt-st" data-lst="${l.id}">Aus</div>
      ${l.dim?`<div class="lt-bar"><div data-brifill="${l.id}"></div></div>`:''}
    </div>`).join('');
  g.querySelectorAll('.lt').forEach(t=>{
    t.addEventListener('click',()=>{
      const dom=t.dataset.dom;
      const wasOn=_S[t.dataset.id]?.state==='on';
      svc(dom,'toggle',{entity_id:t.dataset.id});
      // Optimistic
      t.classList.toggle('on',!wasOn);
      const lst=t.querySelector('[data-lst]');
      if(lst)lst.textContent=wasOn?'Aus':'Ein';
    });
  });
}

function buildDimmer(){
  const wrap=document.getElementById('dim-cards');
  const dimmable=CFG.lights.filter(l=>l.dim);
  wrap.innerHTML=dimmable.map(l=>`
    <div class="dim-card">
      <div class="dim-head">
        <span class="dim-title">${l.name}</span>
        <span class="dim-val" id="dv-${l.id.replace(/\./g,'_')}">–%</span>
      </div>
      <input type="range" class="dslider" min="1" max="100" value="50" data-dimid="${l.id}" id="ds-${l.id.replace(/\./g,'_')}">
    </div>`).join('');
  let _t={};
  wrap.querySelectorAll('[data-dimid]').forEach(sl=>{
    const lid=sl.dataset.dimid;
    const valEl=document.getElementById('dv-'+lid.replace(/\./g,'_'));
    function onInput(){
      if(valEl)valEl.textContent=sl.value+'%';
      const p=+sl.value;
      sl.style.background=`linear-gradient(90deg,rgba(255,159,10,.8) ${p}%,rgba(255,255,255,.1) ${p}%)`;
      clearTimeout(_t[lid]);
      _t[lid]=setTimeout(()=>svc('light','turn_on',{entity_id:lid,brightness_pct:p}),120);
    }
    sl.addEventListener('input',onInput);
    sl.addEventListener('change',onInput);
  });
}

function updateUI(){
  CFG.lights.forEach(l=>{
    const s=_S[l.id];
    const on=s?.state==='on';
    const bri=Math.round((s?.attributes?.brightness||0)/2.55);
    const tile=document.querySelector(`.lt[data-id="${l.id}"]`);
    if(tile){
      tile.classList.toggle('on',on);
      const lst=tile.querySelector('[data-lst]');
      if(lst)lst.textContent=on?(l.dim&&bri>0?bri+'%':'Ein'):'Aus';
      const bar=tile.querySelector(`[data-brifill="${l.id}"]`);
      if(bar)bar.style.width=(on?Math.max(bri,5):0)+'%';
    }
    // Dimmer page
    const dsKey='ds-'+l.id.replace(/\./g,'_');
    const dvKey='dv-'+l.id.replace(/\./g,'_');
    const sl=document.getElementById(dsKey);
    const vl=document.getElementById(dvKey);
    if(sl&&on&&bri>0){
      sl.value=bri;
      const p=bri;
      sl.style.background=`linear-gradient(90deg,rgba(255,159,10,.8) ${p}%,rgba(255,255,255,.1) ${p}%)`;
    }
    if(vl)vl.textContent=on&&bri>0?bri+'%':'–';
  });
  updateWeather();
}

// Premium weather icons (simplified from wz.html)
function wxIcon(cond,night){
  const g=(a,b,c)=>`<defs><radialGradient id="rg_ns" cx="50%" cy="35%" r="60%"><stop offset="0%" stop-color="${a}"/><stop offset="100%" stop-color="${b}"/></radialGradient></defs><circle cx="28" cy="28" r="20" fill="url(#rg_ns)"/>${c||''}`;
  const sun=g('#FFE566','#FF9500');
  const moon=g('#C8D8FF','#6080C0','<path fill="rgba(0,0,0,.25)" d="M20 16c0 8.8 7.2 16 16 16 2.8 0 5.4-.7 7.6-2A16 16 0 0 1 20 16z"/>');
  const cloud=`<rect x="6" y="28" width="44" height="22" rx="11" fill="#C8D0DC"/>`;
  if(cond==='clear'||cond==='sunny') return night?`<svg viewBox="0 0 56 56">${moon}</svg>`:`<svg viewBox="0 0 56 56">${sun}</svg>`;
  if(cond==='partlycloudy') return night?`<svg viewBox="0 0 56 56">${moon}${cloud}</svg>`:`<svg viewBox="0 0 56 56">${sun}${cloud}</svg>`;
  if(cond?.includes('rain')) return `<svg viewBox="0 0 56 56">${cloud}<text x="14" y="54" font-size="16" fill="#60A5FA">💧</text></svg>`;
  if(cond?.includes('snow')) return `<svg viewBox="0 0 56 56">${cloud}<text x="14" y="54" font-size="16">❄️</text></svg>`;
  return `<svg viewBox="0 0 56 56">${cloud}</svg>`;
}

async function updateWeather(){
  const s=_S['weather.forecast_home'];if(!s)return;
  const a=s.attributes||{};
  const h=new Date().getHours();
  const night=h<6||h>=20;
  document.getElementById('ns-wx-ico').outerHTML=wxIcon(s.state,night).replace('<svg','<svg id="ns-wx-ico"');
  document.getElementById('ns-wx-t').textContent=Math.round(a.temperature||0)+'°';
  document.getElementById('ns-wx-d').textContent=s.state?.replace(/_/g,' ')||'';
  document.getElementById('ns-hum').textContent=(a.humidity||'–')+'%';
  document.getElementById('ns-wind').textContent=Math.round(a.wind_speed||0);
  document.getElementById('ns-vis').textContent=Math.round(a.visibility||0);
  
  // Hourly forecast
  const tok=getTok();if(!tok)return;
  try{
    const r=await fetch(`${HA}/api/services/weather/get_forecasts`,{
      method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify({entity_id:'weather.forecast_home',type:'hourly'})
    });
    if(r.ok){
      const d=await r.json();
      const fc=(d?.['weather.forecast_home']?.forecast||[]).slice(0,6);
      const hl=document.getElementById('ns-hourly');
      if(hl)hl.innerHTML=fc.map(f=>{
        const dt=new Date(f.datetime);
        const hStr=String(dt.getHours()).padStart(2,'0')+':00';
        return`<div class="wx-hi"><div class="wx-hi-t">${hStr}</div><div class="wx-hi-v">${Math.round(f.temperature)}°</div><div class="wx-hi-p">${f.precipitation?Math.round(f.precipitation)+'mm':''}</div></div>`;
      }).join('');
    }
  }catch(e){}
}

function navSetup(){
  document.querySelectorAll('[data-pg]').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
      document.querySelectorAll('.nb').forEach(n=>n.classList.remove('on'));
      document.getElementById(b.dataset.pg)?.classList.add('on');
      b.classList.add('on');
    });
  });
}

document.getElementById('login-btn').addEventListener('click',()=>{
  window.location.href=`${HA}/auth/authorize?client_id=${encodeURIComponent(location.origin+'/')}&redirect_uri=${encodeURIComponent(location.href)}&response_type=code`;
});

// Check auth callback
(()=>{
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  if(code){
    fetch(`${HA}/auth/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:`grant_type=authorization_code&code=${code}&client_id=${encodeURIComponent(location.origin+'/')}&redirect_uri=${encodeURIComponent(location.href.split('?')[0])}`
    }).then(r=>r.json()).then(d=>{
      if(d.access_token){localStorage.setItem('wz4',JSON.stringify({access_token:d.access_token,refresh_token:d.refresh_token,expires_in:d.expires_in}));location.href=location.pathname;}
    }).catch(()=>{});
    return;
  }
})();

startClock();
buildScenes();
buildLights();
buildDimmer();
navSetup();
fetchAndUpdate();
setInterval(fetchAndUpdate,15000);
</script>
</body>
</html>
